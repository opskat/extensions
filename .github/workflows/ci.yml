name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          # Lockfiles live per extension; setup-node only looks in the repo root by default.
          cache-dependency-path: extensions/*/frontend/pnpm-lock.yaml

      - name: Run CI
        run: make ci

  # A pull request must not lower an extension's version below what index.json
  # already publishes. Needs no signing key.
  index-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Check extension versions against the index
        run: make index-check

  # Every push to main publishes the extensions whose manifest version is not in
  # index.json yet, in two jobs. `package` builds them from the commit whose CI
  # passed, with no secrets and a read-only token: extension builds run
  # third-party build tooling (pnpm packages, vite plugins), which must never
  # share a machine with the signing key or a write token. `publish` then pushes
  # the packages to ghcr.io/opskat/extensions/<name>:<version>, appends them to
  # index.json, signs it, and commits index.json + index.json.sig back. It runs
  # no extension build code.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: extensions/*/frontend/pnpm-lock.yaml

      - name: Build new versions
        run: go -C tools/publish run . prepare -root "$GITHUB_WORKSPACE" -out "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 1

  # The index commit does not publish again: its message carries [skip ci], which
  # GitHub honours for push events (and a push made with GITHUB_TOKEN starts no
  # workflow run in the first place).
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-extensions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main, for its index.json: runs are serialized (concurrency
          # above), and a queued run must see the index the previous one
          # committed. Versions the index already has, or has a newer version
          # of, are skipped. The packages themselves come from the package job.
          ref: main
          # Full history, so the index commit can be rebased onto a main that
          # moved on while this job ran.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push and index new versions
        env:
          EXTENSION_INDEX_SIGNING_KEY: ${{ secrets.EXTENSION_INDEX_SIGNING_KEY }}
        run: go -C tools/publish run . release -root "$GITHUB_WORKSPACE" -in "$RUNNER_TEMP/packages"

      - name: Commit the index
        run: |
          if [ -z "$(git status --porcelain -- index.json index.json.sig)" ]; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.json.sig
          git commit -m "🔖 Publish extension index [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
