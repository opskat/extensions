name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          # Lockfiles live per extension; setup-node only looks in the repo root by default.
          cache-dependency-path: extensions/*/frontend/pnpm-lock.yaml

      - name: Run CI
        run: make ci

  # A pull request must not lower an extension's version below what index.json
  # already publishes. Needs no signing key.
  index-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Check extension versions against the index
        run: make index-check

  # Every push to main publishes the extensions whose manifest version is not in
  # index.json yet: build, push to ghcr.io/opskat/extensions/<name>:<version>,
  # append to index.json, sign, and commit index.json + index.json.sig back.
  #
  # The index commit does not publish again: its message carries [skip ci], which
  # GitHub honours for push events (and a push made with GITHUB_TOKEN starts no
  # workflow run in the first place).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-extensions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main, not the commit that triggered the run: runs are
          # serialized (concurrency above), and a queued run must see the index
          # the previous one committed, or it would rebuild and re-push versions
          # that are already published.
          ref: main
          # Full history, so the index commit can be rebased onto a main that
          # moved on while this job ran.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: extensions/*/frontend/pnpm-lock.yaml

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish new versions
        env:
          EXTENSION_INDEX_SIGNING_KEY: ${{ secrets.EXTENSION_INDEX_SIGNING_KEY }}
        run: make publish

      - name: Commit the index
        run: |
          if [ -z "$(git status --porcelain -- index.json index.json.sig)" ]; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.json.sig
          git commit -m "🔖 Publish extension index [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
