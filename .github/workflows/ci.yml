name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          # Lockfiles live per extension; setup-node only looks in the repo root by default.
          cache-dependency-path: extensions/*/frontend/pnpm-lock.yaml

      - name: Run CI
        run: make ci
